[project]
name = "feecalc"
version = "0.1.0"
description = "Infrastructure fee pilot: reading building volumes from design documents (CM Resolution No. 151, Annex 4)"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["feecalc*"]

[tool.setuptools.package-data]
feecalc = ["web/templates/*.html", "web/static/*", "norm_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
